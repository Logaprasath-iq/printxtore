<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PRINTXTORE</title>
  <!-- Favicon -->
  <link class="rtl-flip" rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  
  <!-- CSS assets -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: 'var(--color-dark)',
            'dark-teal': 'var(--color-dark-teal)',
            teal: 'var(--color-teal)',
            emerald: 'var(--color-emerald)',
            green: 'var(--color-green)',
            'light-mint': 'var(--color-light-mint)',
            'off-white': 'var(--color-off-white)'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../assets/css/style.css">
  
  <!-- CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/lucide/dist/umd/lucide.min.js"></script>
  
  <!-- App JS Initializers -->
  <script src="../assets/js/database.js" defer></script>
  <script src="../assets/js/theme-rtl.js" defer></script>
  <script src="../assets/js/main.js" defer></script>
  
  <style>
    /* Custom Autofill Styles to override standard light-blue color */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 30px #14212A inset !important;
      -webkit-text-fill-color: #FFFFFF !important;
      transition: background-color 5000s ease-in-out 0s;
    }
    
    html[data-theme="light"] input:-webkit-autofill,
    html[data-theme="light"] input:-webkit-autofill:hover, 
    html[data-theme="light"] input:-webkit-autofill:focus, 
    html[data-theme="light"] input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 30px #FFFFFF inset !important;
      -webkit-text-fill-color: #1A2730 !important;
    }
  </style>
</head>
<body class="bg-[#F7F5F0] dark:bg-[#18242D] text-[#1A2730] dark:text-[#F4F8F5] min-h-screen flex flex-col items-center justify-center p-4 md:p-6 relative overflow-x-hidden transition-colors duration-300">
  
  <!-- Subtle Orange Glow in Dark Mode -->
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(241,90,36,0.06),transparent_60%)] pointer-events-none hidden dark:block"></div>

  <!-- Header Bar (Toggles aligned to the right, back to site removed) -->
  <header class="w-full absolute top-0 left-0 right-0 z-50 px-6 md:px-12 py-6 flex items-center justify-end">
    <!-- Toggles (aligned to the right) -->
    <div class="flex items-center gap-4">
      <button class="theme-toggle p-2.5 rounded-lg bg-white dark:bg-white/5 hover:bg-black/5 dark:hover:bg-white/10 text-[#1A2730] dark:text-white border border-black/15 dark:border-white/10 shadow-sm transition" aria-label="Toggle Theme">
        <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
        <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
      </button>
      
      <button class="rtl-toggle px-4 py-2.5 text-sm text-[#1A2730] dark:text-white hover:text-[#F15A24] dark:hover:text-white transition rounded-lg bg-white dark:bg-white/5 border border-black/15 dark:border-white/10 hover:bg-black/5 dark:hover:bg-white/10 flex items-center justify-center gap-2 font-bold shadow-sm">
        <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
        <span>RTL</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="max-w-[540px] w-full pt-20 pb-10 relative z-10">
    
    <!-- Centered Logo Above Card -->
    <div class="text-center mb-8">
      <a href="../index.html" class="inline-flex items-center gap-2 md:gap-3 font-display text-4xl md:text-5xl font-black tracking-[0.1em] text-[#1A2730] dark:text-white">
        <span class="rtl-flip">
          <svg class="w-9 h-9 md:w-11 md:h-11 text-[#F15A24]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
        </span>
        <span>PRINT<span class="x-brand">X</span>TORE</span>
      </a>
      <p class="text-xs md:text-sm text-[#1A2730]/65 dark:text-white/60 mt-3 uppercase tracking-[0.2em] font-bold">Create Your Account</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white dark:bg-[#202B35] p-6 md:p-10 rounded-[20px] border border-black/10 dark:border-white/5 shadow-xl shadow-black/5 dark:shadow-black/35 space-y-6 text-left">
      <div class="space-y-2">
        <h2 class="text-2xl font-bold font-display text-[#1A2730] dark:text-white">Welcome Back</h2>
        <p class="text-xs text-[#1A2730]/60 dark:text-white/50 leading-relaxed">Log into your portal to manage print orders, artwork and deliveries.</p>
      </div>

      <form id="login-auth-form" class="space-y-4" novalidate>
        <!-- Email Address -->
        <div class="space-y-1.5">
          <label class="block text-xs font-bold text-[#1A2730]/75 dark:text-white/60 uppercase tracking-wider">Email Address *</label>
          <input type="email" id="login-email" required placeholder="e.g. demo@printxtore.com" 
            class="w-full p-3.5 rounded-xl bg-white dark:bg-[#14212A] border border-black/15 dark:border-white/12 text-[#1A2730] dark:text-white placeholder-[#87919A] dark:placeholder-[#87919A] text-sm focus:border-[#F15A24] focus:ring-4 focus:ring-[#F15A24]/12 focus:outline-none transition">
          <p id="err-email" class="text-[11px] text-red-500 font-medium mt-1 hidden"></p>
        </div>

        <!-- Password -->
        <div class="space-y-1.5">
          <label class="block text-xs font-bold text-[#1A2730]/75 dark:text-white/60 uppercase tracking-wider">Password *</label>
          <div class="relative">
            <input type="password" id="login-password" required placeholder="e.g. demo123" 
              class="w-full p-3.5 pr-12 rtl:pl-12 rtl:pr-3.5 rounded-xl bg-white dark:bg-[#14212A] border border-black/15 dark:border-white/12 text-[#1A2730] dark:text-white placeholder-[#87919A] dark:placeholder-[#87919A] text-sm focus:border-[#F15A24] focus:ring-4 focus:ring-[#F15A24]/12 focus:outline-none transition">
            <div id="toggle-pass" class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-[#1A2730]/40 dark:text-white/40 hover:text-[#1A2730] dark:hover:text-white rtl:left-4 rtl:right-auto" onclick="togglePasswordVisibility('login-password', 'toggle-pass')">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye w-5 h-5"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </div>
          </div>
          <p id="err-pass" class="text-[11px] text-red-500 font-medium mt-1 hidden"></p>
        </div>

        <!-- Checkbox & Forgot Password -->
        <div class="flex items-center justify-between text-xs pt-1">
          <label class="inline-flex items-center cursor-pointer text-[#1A2730]/70 dark:text-white/60">
            <input type="checkbox" class="rounded bg-black/5 dark:bg-white/5 border border-black/15 dark:border-white/12 text-[#F15A24] focus:ring-0 mr-2 rtl:ml-2 rtl:mr-0">
            Remember me
          </label>
          <a href="#" onclick="alert('Demo Credentials:\n\nCustomer Account:\ndemo@printxtore.com / demo123\n\nAdmin Account:\nadmin@printxtore.com / admin123')" class="text-[#F15A24] font-semibold hover:underline">Forgot password?</a>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full h-[52px] bg-[#F15A24] hover:bg-[#ff6b3b] text-white font-bold rounded-xl hover:-translate-y-[1px] transition duration-200 text-sm shadow-lg shadow-[#F15A24]/15 uppercase tracking-wider">LOGIN</button>
        </div>

        <!-- Divider with Text -->
        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-black/10 dark:border-white/5"></div>
          <span class="flex-shrink mx-4 text-[10px] text-[#1A2730]/50 dark:text-white/40 font-bold uppercase tracking-wider">Or Login With</span>
          <div class="flex-grow border-t border-black/10 dark:border-white/5"></div>
        </div>

        <!-- Google & Apple Social Login Buttons -->
        <div class="grid grid-cols-2 gap-4">
          <button type="button" onclick="showToast('Google Sign-In is not configured for this demo.', 'error')" class="flex items-center justify-center h-[48px] rounded-xl bg-white dark:bg-[#14212A] hover:bg-black/5 dark:hover:bg-white/5 border border-black/15 dark:border-white/12 text-[#1A2730] dark:text-white text-sm font-semibold transition duration-200">
            <svg class="w-4 h-4 mr-2 rtl:ml-2 rtl:mr-0" viewBox="0 0 24 24" fill="currentColor">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            Google
          </button>
          
          <button type="button" onclick="showToast('Apple Sign-In is not configured for this demo.', 'error')" class="flex items-center justify-center h-[48px] rounded-xl bg-white dark:bg-[#14212A] hover:bg-black/5 dark:hover:bg-white/5 border border-black/15 dark:border-white/12 text-[#1A2730] dark:text-white text-sm font-semibold transition duration-200">
            <svg class="w-4 h-4 mr-2 rtl:ml-2 rtl:mr-0 text-black dark:text-white" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.54 9.103 1.51 12.06 1.005 1.45 2.183 3.076 3.757 3.014 1.512-.06 2.083-.974 3.912-.974 1.824 0 2.34.974 3.918.941 1.605-.027 2.63-1.464 3.61-2.887 1.137-1.66 1.6-3.268 1.628-3.35-.062-.027-3.125-1.2-3.157-4.783-.028-2.99 2.454-4.428 2.565-4.496-1.4-2.05-3.56-2.285-4.325-2.336-2.036-.166-3.987 1.248-4.894 1.248zM15.986 3.65c.846-1.024 1.4-2.44 1.245-3.85-1.207.052-2.68.805-3.543 1.815-.75.87-1.4 2.302-1.224 3.696 1.345.108 2.718-.68 3.522-1.661z"/>
            </svg>
            Apple
          </button>
        </div>
      </form>

      <div class="text-center text-xs text-[#1A2730]/50 dark:text-white/40 pt-6 border-t border-black/10 dark:border-white/5 space-y-3">
        <div>
          Don't have an account? <a href="register.html" class="text-[#F15A24] font-bold hover:underline">Register here</a>
        </div>
        <div class="pt-2">
          <a href="../index.html" class="inline-flex items-center gap-1.5 text-[#1A2730]/50 dark:text-white/40 hover:text-[#F15A24] dark:hover:text-[#F15A24] font-semibold transition">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Website
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Toggle password visibility helper
    function togglePasswordVisibility(inputId, toggleId) {
      const input = document.getElementById(inputId);
      const toggle = document.getElementById(toggleId);
      if (input && toggle) {
        const isPassword = input.type === "password";
        input.type = isPassword ? "text" : "password";
        if (isPassword) {
          toggle.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off w-5 h-5"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`;
        } else {
          toggle.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye w-5 h-5"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
        }
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const loginForm = document.getElementById("login-auth-form");
      
      const emailInp = document.getElementById("login-email");
      const passInp = document.getElementById("login-password");
      
      const errEmail = document.getElementById("err-email");
      const errPass = document.getElementById("err-pass");

      function hideErrors() {
        [errEmail, errPass].forEach(err => {
          if (err) err.classList.add("hidden");
        });
      }

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        hideErrors();

        const email = emailInp.value.trim();
        const pass = passInp.value.trim();

        let isValid = true;

        // Frontend Validation
        if (!email) {
          errEmail.textContent = "Email address is required.";
          errEmail.classList.remove("hidden");
          isValid = false;
        } else {
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(email)) {
            errEmail.textContent = "Please enter a valid email address.";
            errEmail.classList.remove("hidden");
            isValid = false;
          }
        }

        if (!pass) {
          errPass.textContent = "Password is required.";
          errPass.classList.remove("hidden");
          isValid = false;
        }

        if (!isValid) return;

        // Dummy login: authenticate session, show message, and redirect to home page
        if (typeof DB !== "undefined") {
          const customers = DB.get("customers") || [];
          const matchedUser = customers.find(c => c.email && c.email.toLowerCase() === email.toLowerCase());
          const user = matchedUser || {
            id: "CUST-" + Math.floor(1000 + Math.random() * 9000),
            name: email.split("@")[0].replace(/[._]/g, " ").replace(/\b\w/g, l => l.toUpperCase()),
            email: email,
            role: "customer"
          };
          DB.setCurrentUser(user);
        }

        showToast("Logged in Successfully");
        setTimeout(() => {
          window.location.href = "../index.html";
        }, 1000);
      });
    });
  </script>

<script>
window.addEventListener('load', () => {
  const email = document.getElementById('login-email');
  const pass = document.getElementById('login-password');
  const form = document.getElementById('login-auth-form');

  email.value = 'alex.morgan@checkmate.academy';
  pass.value = 'securepass123';
  form.dispatchEvent(new Event('submit', { cancelable: true }));

  // Intercept navigation
  const origLocation = window.location.href;
  const timeoutId = setTimeout(() => {
    document.title = 'LOGIN_REDIRECT_TEST: ' + JSON.stringify({
      toast: document.querySelector('.toast-notification')?.innerText.trim(),
      session: JSON.parse(localStorage.getItem('printxtore_session'))
    });
  }, 500);
});
</script>
</body>
</html>

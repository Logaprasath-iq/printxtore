<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoices — PRINTXTORE</title>
  <link class="rtl-flip" rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: 'var(--color-dark)',
            'dark-teal': 'var(--color-dark-teal)',
            teal: 'var(--color-teal)',
            emerald: 'var(--color-emerald)',
            green: 'var(--color-green)',
            'light-mint': 'var(--color-light-mint)',
            'off-white': 'var(--color-off-white)'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide/dist/umd/lucide.min.js"></script>
  <script src="../assets/js/database.js" defer></script>
  <script src="../assets/js/theme-rtl.js" defer></script>
  <script src="../assets/js/dashboard.js" defer></script>
</head>
<body class="bg-[#F7F5F0] dark:bg-[#18242D] text-[#1A2730] dark:text-[#F4F8F5] min-h-screen transition-colors duration-300">

  <div class="min-h-screen flex flex-col md:flex-row relative">
    
    <!-- Sidebar navigation -->
    <aside id="dashboard-sidebar" class="w-full md:w-64 bg-[#F0EDE6] dark:bg-[#121B22] border-r border-black/5 dark:border-white/5 flex flex-col p-6 text-left absolute md:relative z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-350 ease-in-out min-h-screen">
      <div class="mb-8 flex items-center justify-between">
        <a href="../index.html" class="flex items-center gap-2 font-display text-xl font-bold tracking-wider text-[#1A2730] dark:text-white">
          <span class="rtl-flip">
            <svg class="w-7 h-7 text-[#F15A24]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
            </svg>
          </span>
          <span>PRINT<span class="x-brand">X</span>TORE</span>
        </a>
        <button id="sidebar-close-btn" class="p-1 rounded bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 text-[#1A2730] dark:text-white md:hidden">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- CUSTOMER NAVIGATION -->
      <nav id="nav-client" class="space-y-1 flex-grow">
        <a href="index.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-[#1A2730]/75 dark:text-white/70 hover:bg-black/5 dark:hover:bg-white/5 hover:text-[#1A2730] dark:hover:text-white transition font-semibold">

        </a>
        <a href="new-order.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-[#1A2730]/75 dark:text-white/70 hover:bg-black/5 dark:hover:bg-white/5 hover:text-[#1A2730] dark:hover:text-white transition font-semibold">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> New Print Order
        </a>
        <a href="orders.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-[#1A2730]/75 dark:text-white/70 hover:bg-black/5 dark:hover:bg-white/5 hover:text-[#1A2730] dark:hover:text-white transition font-semibold">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i> My Orders
        </a>
        <a href="track.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-[#1A2730]/75 dark:text-white/70 hover:bg-black/5 dark:hover:bg-white/5 hover:text-[#1A2730] dark:hover:text-white transition font-semibold">
          <i data-lucide="map-pin" class="w-4 h-4"></i> Track Order
        </a>
        <a href="upload.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-[#1A2730]/75 dark:text-white/70 hover:bg-black/5 dark:hover:bg-white/5 hover:text-[#1A2730] dark:hover:text-white transition font-semibold">
          <i data-lucide="upload" class="w-4 h-4"></i> Upload Artwork
        </a>
        <a href="invoices.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm bg-gradient-to-r from-[#F15A24] to-[#ff6b3b] text-white font-bold shadow-lg">
          <i data-lucide="file-text" class="w-4 h-4"></i> Invoices
        </a>
        <a href="profile.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-[#1A2730]/75 dark:text-white/70 hover:bg-black/5 dark:hover:bg-white/5 hover:text-[#1A2730] dark:hover:text-white transition font-semibold">
          <i data-lucide="user" class="w-4 h-4"></i> Profile
        </a>
        <a href="notifications.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-[#1A2730]/75 dark:text-white/70 hover:bg-black/5 dark:hover:bg-white/5 hover:text-[#1A2730] dark:hover:text-white transition font-semibold">
          <i data-lucide="bell" class="w-4 h-4"></i> Notifications
        </a>
        <a href="settings.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-[#1A2730]/75 dark:text-white/70 hover:bg-black/5 dark:hover:bg-white/5 hover:text-[#1A2730] dark:hover:text-white transition font-semibold">
          <i data-lucide="settings" class="w-4 h-4"></i> Settings
        </a>

      <div class="mt-auto pt-6 border-t border-black/5 dark:border-white/5">

        <div class="flex items-center gap-3">
          <button id="sidebar-toggle-btn" class="p-2 rounded bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 text-[#1A2730] dark:text-white md:hidden">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <div>
            <h1 class="text-3xl font-bold font-display text-[#1A2730] dark:text-white">Invoices</h1>
            <p class="text-xs text-[#1A2730]/50 dark:text-white/50">Print and view transactional billing records.</p>
          </div>
        </div>
        
        <div class="flex items-center gap-3">
          <a href="../index.html" class="px-3.5 py-1.5 text-xs text-[#1A2730] dark:text-white transition rounded-lg bg-white dark:bg-white/5 border border-black/15 dark:border-white/10 hover:bg-black/5 dark:hover:bg-white/10 flex items-center justify-center gap-1.5 font-semibold shadow-sm">
            <i data-lucide="globe" class="w-3.5 h-3.5"></i>
            <span>Back to Site</span>
          </a>

          <button class="theme-toggle p-2.5 rounded-lg bg-white dark:bg-white/5 hover:bg-black/5 dark:hover:bg-white/10 text-[#1A2730] dark:text-white border border-black/15 dark:border-white/10 transition shadow-sm" aria-label="Toggle Theme">

            <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
          </button>
          
          <button class="rtl-toggle px-3 py-1.5 text-xs text-[#1A2730] dark:text-white hover:text-[#1A2730] dark:hover:text-white transition rounded-lg bg-white dark:bg-white/5 border border-black/15 dark:border-white/10 hover:bg-black/5 dark:hover:bg-white/10 flex items-center justify-center gap-1.5 font-semibold shadow-sm">
            <i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i>
            <span>RTL</span>
          </button>

      </div>

      <div id="invoices-container">

      </div>

  <div id="dashboard-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden">
    <div class="bg-white dark:bg-[#202B35] max-w-xl w-full rounded-2xl border border-black/10 dark:border-white/5 p-6 md:p-8 space-y-6 relative max-h-[90vh] overflow-y-auto text-[#1A2730] dark:text-[#F4F8F5] shadow-2xl">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-[#1A2730]/50 dark:text-white/50 hover:text-red-500 transition"><i data-lucide="x" class="w-6 h-6"></i></button>
      <div id="modal-content"></div>
    </div>

</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance — PRINTXTORE</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  
  <!-- CSS assets -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: 'var(--color-dark)',
            'dark-teal': 'var(--color-dark-teal)',
            teal: 'var(--color-teal)',
            emerald: 'var(--color-emerald)',
            green: 'var(--color-green)',
            'light-mint': 'var(--color-light-mint)',
            'off-white': 'var(--color-off-white)'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../assets/css/style.css">
  
  <!-- CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/lucide/dist/umd/lucide.min.js"></script>
  
  <!-- App JS Initializers -->
  <script src="../assets/js/database.js" defer></script>
  <script src="../assets/js/theme-rtl.js" defer></script>
</head>
<body class="bg-gradient-to-br from-dark to-dark-teal text-off-white min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
  <!-- Top Bar with Logo & Actions -->
  <div class="absolute top-6 left-6 right-6 flex items-center justify-between z-50">
    <a href="../index.html" class="flex items-center gap-2 font-display text-xl font-bold tracking-wider text-white">
      <span class="rtl-flip">
        <svg class="w-8 h-8 text-green" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
        </svg>
      </span>
      <span>PRINT<span class="x-brand">X</span>TORE</span>
    </a>

    <div class="flex items-center gap-3">
      <button class="theme-toggle p-2.5 rounded-lg bg-white/5 hover:bg-white/10 text-white/80 hover:text-white border border-white/10 transition" aria-label="Toggle Theme">
        <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
        <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
      </button>
      
      <button class="rtl-toggle px-3 py-1.5 text-xs text-white/85 hover:text-white transition rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 flex items-center justify-center gap-1.5 font-semibold">
        <i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i>
        <span>RTL</span>
      </button>
    </div>
  </div>

  
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(113,178,128,0.08),transparent_60%)]"></div>

  <div class="max-w-md w-full text-center space-y-10 relative z-10">
    TORE</span>
    
    <div class="space-y-4">
      <div class="w-16 h-16 rounded-full bg-green/10 text-green flex items-center justify-center mx-auto border border-green/30 animate-spin duration-3000">
        <i data-lucide="cog" class="w-8 h-8"></i>
      </div>
      <h1 class="text-3xl font-extrabold font-display text-white">We're Making Something Better.</h1>
      <p class="text-xs text-white/50 max-w-xs mx-auto">Our pre-press engine is undergoing routine calibration sweeps. Estimated downtime is under 2 hours.</p>
    </div>

    <!-- Live Animated Progress Bar -->
    <div class="space-y-2">
      <div class="w-full h-2 bg-dark/60 rounded-full border border-white/5 overflow-hidden">
        <div id="maint-bar" class="w-1/3 h-full bg-gradient-to-r from-emerald to-green rounded-full transition-all duration-1000 ease-in-out"></div>
      </div>
      <div class="flex justify-between text-[10px] text-white/40 font-bold uppercase">
        <span>Pre-Press Calibration</span>
        <span id="maint-pct">35% Completed</span>
      </div>
    </div>

    <div class="pt-6 border-t border-white/5 space-y-3">
      <p class="text-xs text-white/40">Need immediate assistance with active orders?</p>
      <a href="mailto:support@printxtore.com" class="inline-flex items-center gap-2 text-xs font-bold text-green hover:underline">
        <i data-lucide="mail" class="w-4 h-4"></i> Contact Support Desk
      </a>
    </div>

    <div class="flex justify-center gap-6 text-white/30">
      <a href="#" class="hover:text-green transition"><i data-lucide="instagram" class="w-5 h-5"></i></a>
      <a href="#" class="hover:text-green transition"><i data-lucide="facebook" class="w-5 h-5"></i></a>
      <a href="#" class="hover:text-green transition"><i data-lucide="linkedin" class="w-5 h-5"></i></a>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Loop simulated progress
    const bar = document.getElementById("maint-bar");
    const pct = document.getElementById("maint-pct");
    let progress = 35;

    setInterval(() => {
      progress += Math.floor(Math.random() * 5) + 1;
      if (progress >= 95) progress = 35; // loop back down for mock continuity
      bar.style.width = `${progress}%`;
      pct.textContent = `${progress}% Completed`;
    }, 3000);
  </script>
</body>
</html>
